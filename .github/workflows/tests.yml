name: Tests

on:
  push:
    branches: [ main, html ]
    # Repeated under pull_request below: GitHub Actions does not expand YAML anchors.
    paths:
      - 'scripts/**'
      - 'preface.tex'
      - 'chapter*.tex'
      - 'epilogue.tex'
      - 'references.bib'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'preface.tex'
      - 'chapter*.tex'
      - 'epilogue.tex'
      - 'references.bib'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# Read-only: this workflow runs on pull requests, including those from forks.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --with pytest pytest -v scripts
