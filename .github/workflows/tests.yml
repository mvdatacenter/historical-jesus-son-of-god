name: Tests

on:
  push:
    branches: [ main, html ]
    # Repeated under pull_request below: GitHub Actions does not expand YAML anchors.
    paths:
      - 'scripts/**'
      # test_githooks.py asserts on these two, so a change to either has to run it.
      - '.githooks/**'
      - '.gitignore'
      - 'preface.tex'
      - 'chapter*.tex'
      - 'epilogue.tex'
      - 'references.bib'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.githooks/**'
      - '.gitignore'
      - 'preface.tex'
      - 'chapter*.tex'
      - 'epilogue.tex'
      - 'references.bib'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

# Read-only: this workflow runs on pull requests, including those from forks.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # test_download_sources.py imports download_sources, which needs requests
      # and beautifulsoup4; the other test modules are stdlib-only. Poetry is
      # deliberately not used: pyproject pins tychicus to a private SSH git
      # remote that CI cannot reach.
      - name: Install pytest
        run: pip install pytest requests beautifulsoup4

      - name: Run tests
        working-directory: scripts
        run: python -m pytest -v
